# Copy this file to 02-secrets.yaml and fill in real values.
# 02-secrets.yaml is gitignored (see note at bottom of this file).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: attendance
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<USER>:<PASS>@<CLUSTER>.mongodb.net/attendance?retryWrites=true&w=majority"
  JWT_ACCESS_SECRET: "<generate: openssl rand -hex 48>"
  JWT_REFRESH_SECRET: "<generate: openssl rand -hex 48>"
  JWT_QR_SECRET: "<generate: openssl rand -hex 48>"
  RABBITMQ_PASSWORD: "attendance"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "attendance"
  RABBITMQ_DEFAULT_PASS: "attendance"
# IMPORTANT: never commit 02-secrets.yaml with real values. Add it to .gitignore.
