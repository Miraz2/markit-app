name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub Container Registry image names (free)
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/attendance-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/attendance-frontend
  EKS_CLUSTER: attendance
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

      - name: Trigger deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Apply Kubernetes resources
        run: |
          kubectl apply -f k8s/base/01-configmap.yaml
          kubectl apply -f k8s/base/03-backend.yaml
          kubectl apply -f k8s/base/04-frontend.yaml
          kubectl rollout status deployment/backend -n attendance --timeout=180s
          kubectl rollout status deployment/frontend -n attendance --timeout=180s
