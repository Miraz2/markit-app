name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub Container Registry image names (free)
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/attendance-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/attendance-frontend

jobs:
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

      - name: Configure kubectl for Oracle K3s
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.K3S_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.K3S_KUBECONFIG }}

      - name: Deploy to Oracle K3s
        run: |
          kubectl apply -f k8s/base/01-configmap.yaml
          kubectl set image deployment/backend -n attendance \
            backend=${{ env.BACKEND_IMAGE }}:latest
          kubectl set image deployment/frontend -n attendance \
            frontend=${{ env.FRONTEND_IMAGE }}:latest
          kubectl rollout status deployment/backend -n attendance --timeout=180s
          kubectl rollout status deployment/frontend -n attendance --timeout=180s
