apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: attendance
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/miraz2/attendance-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# k3d exposes LoadBalancer services automatically (mapped to host via --port flags).
# No paid/cloud load balancer needed - k3d's built-in traefik ingress.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: attendance
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
