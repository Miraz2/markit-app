apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-env
  namespace: attendance
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_ORIGIN: "http://<PUBLIC_IP>:30080"
  JWT_ACCESS_EXPIRES: "15m"
  JWT_REFRESH_EXPIRES: "7d"
  QR_TOKEN_EXPIRES_SECONDS: "10"
  QR_CLOCK_TOLERANCE_SECONDS: "20"
  QR_GEO_RADIUS_METERS: "150"
  COOKIE_SECURE: "false"
  RABBITMQ_URL: "amqp://rabbitmq.rabbitmq:5672"
  MINIO_ENDPOINT: "minio.minio:9000"
  MINIO_BUCKET: "attendance"
