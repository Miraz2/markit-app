<svg viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Rounded square icon chip -->
  <rect x="4" y="4" width="136" height="136" rx="34" fill="url(#iconGrad)"/>

  <!-- Clipboard silhouette -->
  <rect x="40" y="30" width="64" height="88" rx="10" fill="#ffffff" opacity="0.14"/>
  <rect x="54" y="22" width="36" height="16" rx="6" fill="#ffffff"/>

  <!-- List lines -->
  <rect x="50" y="56" width="44" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="50" y="72" width="44" height="6" rx="3" fill="#ffffff" opacity="0.55"/>

  <!-- Checkmark badge, no backing circle -->
  <circle cx="102" cy="102" r="22" fill="url(#checkGrad)"/>
  <path d="M91 102 L98 109 L114 93" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
